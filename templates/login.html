<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Result Analysis System – Login</title>
  <link rel="stylesheet" href="/static/css/login.css">
  <style>
    /* Two-step transition */
    #stepCredentials { animation: fadeSlideIn .2s ease; }
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .college-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface-2, #1e2535);
      border: 1px solid var(--border, #2a3347);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 16px;
      font-size: 12px;
      color: var(--muted, #8899aa);
    }
    .college-badge__code {
      font-family: monospace;
      font-weight: 700;
      color: var(--accent-2, #4f9eff);
      font-size: 13px;
    }
    .college-badge__change {
      margin-left: auto;
      background: none;
      border: none;
      color: var(--accent-2, #4f9eff);
      cursor: pointer;
      font-size: 11px;
      padding: 0;
      text-decoration: underline;
    }
    .college-badge__change:hover { opacity: .8; }
  </style>
</head>
<body>

  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-blob bg-blob--1" aria-hidden="true"></div>
  <div class="bg-blob bg-blob--2" aria-hidden="true"></div>

  <div class="login-wrap">
    <div class="login-card">

      <!-- Logo + branding -->
      <div class="login-logo">
        <div class="login-logo__icon">
          <img src="/static/img/image.png" alt="Logo" style="width:100%;height:100%;object-fit:contain;">
        </div>
        <div class="login-logo__text">
          <span class="login-logo__title">Result Analysis</span>
          <span class="login-logo__badge">VTU · Academic Portal</span>
        </div>
      </div>

      <div class="login-heading">
        <h1>Welcome back</h1>
        <p>Sign in to your account to continue</p>
      </div>

      <div class="security-banner">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <span>Secured Result Analysis · Team Vybex</span>
      </div>

      <form id="loginForm" autocomplete="on" novalidate>

        <!-- ═══ STEP 1: College Code ═══ -->
        <div id="stepCollege">
          <div class="form-group">
            <label for="college">College Code</label>
            <div class="input-wrap">
              <svg class="input-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
              </svg>
              <input type="text" id="college" name="college"
                     placeholder="e.g. jvit"
                     autocomplete="organization" maxlength="12"
                     spellcheck="false" style="text-transform:lowercase;">
            </div>
            <small style="color:var(--muted);font-size:11px;margin-top:4px;display:block;">
              Leave blank if you are the platform Creator.
            </small>
          </div>

          <button type="button" id="continueBtn" class="login-btn">
            <span id="continueBtnText">Continue</span>
            <svg id="continueBtnArrow" width="16" height="16" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2">
              <line x1="5" y1="12" x2="19" y2="12"/>
              <polyline points="12 5 19 12 12 19"/>
            </svg>
          </button>
        </div>

        <!-- ═══ STEP 2: Credentials (hidden until college confirmed) ═══ -->
        <div id="stepCredentials" class="hidden">

          <!-- College badge with ← Change -->
          <div class="college-badge" id="collegeBadge">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            <span class="college-badge__code" id="collegeBadgeText"></span>
            <button type="button" class="college-badge__change" id="changeCollegeBtn">
              ← Change
            </button>
          </div>

          <!-- Username -->
          <div class="form-group">
            <label for="username">Username</label>
            <div class="input-wrap">
              <svg class="input-icon" width="15" height="15" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
              <input type="text" id="username" name="username"
                     placeholder="Enter your username"
                     autocomplete="username" maxlength="64" spellcheck="false">
            </div>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrap">
              <svg class="input-icon" width="15" height="15" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0110 0v4"/>
              </svg>
              <input type="password" id="password" name="password"
                     placeholder="Enter your password"
                     autocomplete="current-password" maxlength="128">
              <button type="button" class="toggle-eye" id="toggleEye"
                      aria-label="Toggle password visibility">
                <svg id="eyeIcon" width="15" height="15" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Sign In button -->
          <button type="submit" id="loginBtn" class="login-btn">
            <span id="loginBtnText">Sign In</span>
            <svg id="loginBtnArrow" width="16" height="16" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2">
              <line x1="5" y1="12" x2="19" y2="12"/>
              <polyline points="12 5 19 12 12 19"/>
            </svg>
            <span id="loginSpinner" class="spinner hidden"></span>
          </button>

        </div>

      </form>

      <!-- Error / success message — always visible below the form -->
      <div id="message" class="login-message hidden" role="alert" aria-live="polite"></div>

    </div>

    <footer class="login-footer">
      <span>Result Analysis Platform</span>
      <span class="footer-dot">·</span>
      <span>Multi-College Edition</span>
      <span class="footer-dot">·</span>
      <span class="version-tag">v2.0.0</span>
    </footer>
  </div>

  <script src="/static/js/login.js"></script>
</body>
</html>
